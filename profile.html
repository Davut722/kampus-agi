<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim / Kullanıcı Profili — UniReview</title>
    <link rel="stylesheet" href="css/style.css?v=46">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body data-page="profile">
    <nav class="nav">
        <div class="nav__inner">
            <a href="index.html" class="nav__logo"><span class="nav__logo-icon">🎓</span> UniReview</a>
            <button class="nav__hamburger" aria-label="Menüyü aç">
                <span class="nav__hamburger-line"></span>
                <span class="nav__hamburger-line"></span>
                <span class="nav__hamburger-line"></span>
            </button>
            <ul class="nav__links">
                <li><a href="index.html" class="nav__link">Ana Sayfa</a></li>
                <li><a href="university.html" class="nav__link">Üniversite</a></li>
                <li><a href="compare.html" class="nav__link">Karşılaştır</a></li>
                <li><a href="review-form.html" class="nav__link">Değerlendir</a></li>
                <li><a href="profile.html" class="nav__link nav__link--active">Profilim</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <header class="profile-header profile-section reveal-up"
            style="margin-top: var(--space-xl); background: var(--color-surface); padding: var(--space-lg); border-radius: var(--radius-lg); border: 1px solid var(--color-border); display: flex; align-items: center; gap: 20px;">
            <div class="profile-header__avatar"
                style="width: 80px; height: 80px; border-radius: 50%; background: var(--color-accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: bold;">
                ??</div>
            <div class="profile-header__info">
                <h2 style="font-size: 1.5rem; margin-bottom: 5px;">Yükleniyor...</h2>
                <p style="color: var(--color-text-muted);">UniReview Üyesi</p>
            </div>
        </header>

        <div class="profile-main">
            <section class="profile-section hero__stats reveal-up"
                style="animation-delay: 0.1s; padding: var(--space-lg); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);">
                <div class="hero__stat">
                    <div class="hero__stat-value" id="stat-likes">0</div>
                    <div class="hero__stat-label">Toplam Beğeni</div>
                </div>
                <div class="hero__stat">
                    <div class="hero__stat-value" id="stat-dislikes">0</div>
                    <div class="hero__stat-label">Katılmayanlar</div>
                </div>
                <div class="hero__stat">
                    <div class="hero__stat-value" id="stat-approval">-%</div>
                    <div class="hero__stat-label">Onay Oranı</div>
                </div>
            </section>

            <section class="profile-section reveal-up" style="animation-delay: 0.2s;">
                <h2 class="section-title">Değerlendirmeler</h2>
                <div id="user-reviews-list"></div>
            </section>
        </div>
    </main>

    <script src="js/uni_images_data.js" defer></script>
    <script src="js/uni_websites_data.js" defer></script>
    <script src="js/universities.js" defer></script>
    <script type="module" src="js/app.js?v=47"></script>
</body>

</html>
