<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Sesi — Üniversite Değerlendirme Platformu</title>
    <link rel="stylesheet" href="css/style.css?v=52">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>

<body>

    <nav class="nav">
        <div class="nav__inner">
            <div class="nav__left">
                <a href="#/home" class="nav__logo" data-nav="home"><span class="nav__logo-icon">🎓</span> Kampüs Sesi</a>
            </div>
            <div class="nav__center">
                <ul class="nav__links">
                    <li><a href="#/home" class="nav__link nav__link--active" data-nav="home">Ana Sayfa</a></li>
                    <li><a href="#/university" class="nav__link" data-nav="university">Üniversiteler</a></li>
                    <li><a href="#/compare" class="nav__link" data-nav="compare">Karşılaştır</a></li>
                    <li><a href="#/review-form" class="nav__link" data-nav="review-form">Değerlendir</a></li>
                </ul>
            </div>

            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="nav__right" id="nav-actions">
                    <!-- Theme toggle and Auth link will be injected here via app.js -->
                </div>
                
                <button class="nav__hamburger" aria-label="Menüyü aç">
                    <span class="nav__hamburger-line"></span>
                    <span class="nav__hamburger-line"></span>
                    <span class="nav__hamburger-line"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Side Drawer Menu (Yandan Açılır Menü) -->
    <div class="side-drawer-overlay" id="side-drawer-overlay"></div>
    <aside class="side-drawer" id="side-drawer">
        <div class="side-drawer__header">
            <h2 class="side-drawer__title"><span class="nav__logo-icon">🎓</span> Menü</h2>
            <button class="side-drawer__close" id="side-drawer-close" aria-label="Menüyü kapat">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="side-drawer__content">
            <ul class="side-drawer__nav">
                <li><a href="#/home" class="side-drawer__link" data-nav="home"><i data-lucide="home"></i> Ana Sayfa</a></li>
                <li><a href="#/university" class="side-drawer__link" data-nav="university"><i data-lucide="building-2"></i> Üniversiteler</a></li>
                <li><a href="#/compare" class="side-drawer__link" data-nav="compare"><i data-lucide="scale"></i> Karşılaştır</a></li>
                <li><a href="#/review-form" class="side-drawer__link" data-nav="review-form"><i data-lucide="pen-line"></i> Değerlendir</a></li>
                <li class="side-drawer__divider"></li>
                <li><a href="#/favorites" class="side-drawer__link side-drawer__link--special" data-nav="favorites"><i data-lucide="heart"></i> Favorilerim</a></li>
            </ul>
        </div>
    </aside>

    <!-- SPA Dynamic Content Container -->
    <div id="app-root"></div>

    <script src="js/universities.js"></script>
    <script type="module" src="js/app.js?v=48"></script>
</body>

</html>
